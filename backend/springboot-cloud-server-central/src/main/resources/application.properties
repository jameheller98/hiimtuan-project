spring.application.name=cloud-server-central
server.port=8888

# Local dev: reads ../springboot-config relative to the working directory
# Docker: CONFIG_GIT_URI is set to file:///config (volume-mounted)
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:file://${user.dir}/../springboot-config}
spring.cloud.config.server.git.skip-ssl-validation=true
spring.cloud.config.server.git.force-pull=true