syntax = "proto3";

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.hiimtuan.mail_service.proto";
option java_outer_classname = "MailServiceProto";

message RequestMail {
  string recipient = 1;
  string msgBody = 2;
  string subject = 3;
}

service MailService {
  rpc sendSimpleMail(RequestMail) returns (stream google.protobuf.Empty) {}
}